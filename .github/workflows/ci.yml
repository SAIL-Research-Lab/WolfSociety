name: Python CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'paper_experiments_v3/**'
      - 'paper_experiments/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'paper_experiments_v3/**'
      - 'paper_experiments/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install WolfBench
        run: python -m pip install -e ".[dev,llm]"
      - name: Run Python tests
        run: pytest -q
      - name: Validate server script syntax
        run: bash -n scripts/serve_vllm.sh scripts/benchmark_vllm.sh scripts/run_pilot.sh scripts/run_full_llm_paper.sh
      - name: Plan full-LLM mock integration
        run: >-
          python -m paper_experiments.runner plan --mock --stage smoke
          --families all --sizes 8 --seeds 9001 --horizon 2
          --manifest runs/ci/manifest.json
      - name: Run full-LLM mock integration
        run: python -m paper_experiments.runner run --manifest runs/ci/manifest.json --output runs/ci
      - name: Check CLI scenario package data
        run: wolfbench scenarios
      - name: Run a deterministic smoke episode
        run: wolfbench run --scenario s1 --alpha 0.02 --n-society 40 --seed 1
      - name: Validate paper-v3 integration without an external API
        run: >-
          python -m paper_experiments_v3.experiments.p00_validate
          --profile smoke
          --mock
          --quota-mode standard
